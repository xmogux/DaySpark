spring.application.name=DaySpark
server.port=8080
# Single-user local app: listen on this PC only (not on the campus Wi-Fi).
# Override with --server.address=0.0.0.0 if you deliberately need LAN access.
server.address=127.0.0.1

spring.datasource.url=jdbc:h2:file:./dayspark_v2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

spring.thymeleaf.cache=false
app.upload-dir=uploads
