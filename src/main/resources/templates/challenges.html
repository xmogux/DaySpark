<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도전 관리 — DaySpark</title><link rel="stylesheet" th:href="@{/css/app.css(v=56)}"></head><body><div class="page-shell">
<header th:replace="~{fragments/layout :: topbar('challenges')}"></header>
<main><section class="page-heading"><div><span class="eyebrow">CHALLENGE MANAGER</span><h1>내 도전 관리</h1><p>목표를 만들고 반복 요일과 기간을 설정하세요.</p></div><a class="primary-btn" href="/challenges/new">+ 새 도전 만들기</a></section><div th:if="${success}" class="toast success" th:text="${success}"></div><div th:if="${error}" class="toast error" th:text="${error}"></div>
<div class="manage-list"><article class="manage-card" th:each="c:${challenges}" th:classappend="${!c.active} ? ' inactive' : ''"><div><div class="task-tags"><span class="category-mini" th:text="${c.category}">STUDY</span><span th:text="${c.repeatLabel}">매일</span><span th:text="${c.minutes}+'분'">10분</span><span class="state-dot" th:text="${c.active ? '진행 중' : '쉬는 중'}">진행 중</span><span class="review-chip" th:if="${c.category == 'STUDY' && c.reviewEnabled}" th:text="'↻ 복습 ' + ${c.reviewCount} + '회'">↻ 복습 4회</span></div><h3 th:text="${c.title}">목표</h3><p th:text="${c.description}">설명</p><small><span th:text="${#temporals.format(c.startDate,'yyyy.MM.dd')}"></span> ~ <span th:text="${c.endDate == null ? '계속' : #temporals.format(c.endDate,'yyyy.MM.dd')}"></span></small></div><div class="manage-actions"><a class="secondary-btn" th:href="@{'/challenges/'+${c.id}}">상세·통계</a><a class="ghost-btn" th:href="@{'/challenges/'+${c.id}+'/edit'}">수정</a><form th:action="@{'/challenges/'+${c.id}+'/toggle'}" method="post"><button class="ghost-btn" type="submit" th:text="${c.active ? '쉬기' : '재개'}">쉬기</button></form><form th:action="@{'/challenges/'+${c.id}+'/delete'}" method="post" onsubmit="return confirm('이 도전과 완료 기록을 모두 삭제할까요?')"><button class="danger-btn" type="submit">삭제</button></form></div></article></div></main><footer><span>DaySpark</span><p>Challenge CRUD + schedule</p></footer></div></body></html>
