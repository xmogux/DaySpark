<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${challenge == null ? '새 도전' : '도전 수정'}+' — DaySpark'">도전</title><link rel="stylesheet" th:href="@{/css/app.css(v=55)}"></head><body><div class="page-shell">
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>DaySpark</span></a><nav><a class="nav-link" href="/">오늘</a><a class="nav-link active" href="/challenges">도전</a><a class="nav-link" href="/calendar">달력</a><a class="nav-link" href="/stats">통계</a><a class="nav-link" href="/focus">집중 타이머</a><a class="nav-link" href="/history">기록</a></nav></header>
<main class="form-page"><a class="back-link" href="/challenges">← 도전 목록</a><section class="form-shell"><div class="form-intro"><span class="eyebrow">DESIGN YOUR ROUTINE</span><h1 th:text="${challenge == null ? '새 도전 만들기' : '도전 수정하기'}">새 도전 만들기</h1><p>무리하지 않고 반복할 수 있을 만큼 작고 구체적으로 적어보세요.</p></div><div th:if="${error}" class="toast error" th:text="${error}"></div>
<form class="challenge-form" action="/challenges/save" method="post"><input th:if="${challenge != null}" type="hidden" name="id" th:value="${challenge.id}"><div class="form-grid"><label class="field span-2"><span>도전 이름</span><input name="title" maxlength="80" required placeholder="예: 일본어 단어 20개 외우기" th:value="${challenge?.title}"></label><label class="field span-2"><span>설명</span><textarea name="description" maxlength="220" placeholder="어떻게 수행할지 짧게 적어주세요." th:text="${challenge?.description}"></textarea></label><label class="field"><span>카테고리</span><select name="category"><option th:selected="${challenge != null && challenge.category == 'STUDY'}">STUDY</option><option th:selected="${challenge != null && challenge.category == 'HEALTH'}">HEALTH</option><option th:selected="${challenge != null && challenge.category == 'MOVE'}">MOVE</option><option th:selected="${challenge != null && challenge.category == 'LIFE'}">LIFE</option><option th:selected="${challenge != null && challenge.category == 'WORK'}">WORK</option></select></label><label class="field"><span>예상 시간(분)</span><input type="number" name="minutes" min="1" max="600" th:value="${challenge == null ? 10 : challenge.minutes}"></label>
<label class="field"><span>하루 목표 수치</span><input type="number" name="targetValue" min="1" max="10000" required th:value="${challenge == null ? 1 : challenge.targetValue}"></label><label class="field"><span>목표 단위</span><select name="targetUnit"><option value="분" th:selected="${challenge != null && challenge.targetUnit == '분'}">분</option><option value="페이지" th:selected="${challenge != null && challenge.targetUnit == '페이지'}">페이지</option><option value="회" th:selected="${challenge == null || challenge.targetUnit == '회'}">회</option><option value="개" th:selected="${challenge != null && challenge.targetUnit == '개'}">개</option><option value="잔" th:selected="${challenge != null && challenge.targetUnit == '잔'}">잔</option></select></label><label class="field span-2"><span>주간 도전 완료 목표 (0 = 설정 안 함)</span><input type="number" name="weeklyTarget" min="0" max="7" th:value="${challenge == null ? 0 : challenge.weeklyTarget}"></label>
<div id="reviewSettings" class="review-settings span-2">
  <div class="review-settings-head">
    <div><span class="review-kicker">↻ STUDY REVIEW PLAN</span><strong>복습 플랜</strong><small>공부 도전에만 적용돼요. 복습할 날짜 간격은 직접 정할 수 있습니다.</small></div>
    <label class="review-switch"><input id="reviewEnabled" type="checkbox" name="reviewEnabled" value="true" th:checked="${challenge != null && challenge.reviewEnabled}"><span>사용</span></label>
  </div>
  <div id="reviewFields" class="review-fields">
    <label class="field"><span>복습 기준일</span><input id="reviewBaseDate" type="date" name="reviewBaseDate" th:value="${challenge == null ? today : (challenge.reviewBaseDate == null ? challenge.startDate : challenge.reviewBaseDate)}"></label>
    <label class="field"><span>복습 간격 (일)</span><input id="reviewIntervals" type="text" name="reviewIntervals" placeholder="예: 1, 3, 7, 14" th:value="${challenge == null || #strings.isEmpty(challenge.reviewIntervals) ? '1,3,7,14' : challenge.reviewIntervals}"><small>예: 1, 3, 7, 14 → 기준일 다음 날, 3일 뒤, 7일 뒤, 14일 뒤</small></label>
    <div class="review-preview"><span>예정일 미리보기</span><div id="reviewPreviewDates"></div></div>
  </div>
</div>
<div class="field span-2"><span>반복 일정</span><div class="repeat-options"><label><input type="radio" name="repeatType" value="DAILY" th:checked="${challenge == null || challenge.repeatType == 'DAILY'}"> 매일</label><label><input type="radio" name="repeatType" value="WEEKDAYS" th:checked="${challenge != null && challenge.repeatType == 'WEEKDAYS'}"> 평일</label><label><input type="radio" name="repeatType" value="WEEKENDS" th:checked="${challenge != null && challenge.repeatType == 'WEEKENDS'}"> 주말</label><label><input type="radio" name="repeatType" value="CUSTOM" th:checked="${challenge != null && challenge.repeatType == 'CUSTOM'}"> 요일 선택</label></div><div id="customDays" class="weekday-row"><label><input type="checkbox" name="repeatDays" value="MONDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'MONDAY')}">월</label><label><input type="checkbox" name="repeatDays" value="TUESDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'TUESDAY')}">화</label><label><input type="checkbox" name="repeatDays" value="WEDNESDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'WEDNESDAY')}">수</label><label><input type="checkbox" name="repeatDays" value="THURSDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'THURSDAY')}">목</label><label><input type="checkbox" name="repeatDays" value="FRIDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'FRIDAY')}">금</label><label><input type="checkbox" name="repeatDays" value="SATURDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'SATURDAY')}">토</label><label><input type="checkbox" name="repeatDays" value="SUNDAY" th:checked="${challenge != null && #strings.contains(challenge.repeatDays,'SUNDAY')}">일</label></div></div>
<label class="field"><span>시작일</span><input type="date" name="startDate" required th:value="${challenge == null ? today : challenge.startDate}"></label><label class="field"><span>종료일 <em>선택</em></span><input type="date" name="endDate" th:value="${challenge?.endDate}"></label></div><div class="form-actions"><a class="ghost-btn" href="/challenges">취소</a><button class="primary-btn" type="submit" th:text="${challenge == null ? '도전 만들기 →' : '수정 저장 →'}">저장</button></div></form></section></main></div><script th:src="@{/js/app.js}"></script></body></html>
