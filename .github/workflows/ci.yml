name: Windows automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Run all 48 tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run local Windows test launcher
        shell: cmd
        run: RUN_ALL_TESTS.bat

      - name: Save test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-48-tests
          path: test-results/
          if-no-files-found: warn
