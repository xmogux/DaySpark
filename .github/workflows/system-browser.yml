name: Browser system tests

on:
  push:
    branches: [tests/minimal-integration-system-20261118]
  pull_request:

permissions:
  contents: read

jobs:
  browser-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright (use preinstalled Google Chrome)
        run: npm install --no-save playwright@1.56.1

      - name: Start DaySpark with isolated system-test database
        env:
          APP_SEED_DEMO_DATA: 'false'
          APP_UPLOAD_DIR: target/system-test-uploads
          SPRING_DATASOURCE_URL: jdbc:h2:file:./target/system-test-db
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SERVER_ADDRESS: 127.0.0.1
        run: |
          mkdir -p target
          chmod +x ./mvnw
          ./mvnw -B -ntp spring-boot:run > target/system-server.log 2>&1 &
          echo $! > target/system-server.pid
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "DaySpark server ready"
              exit 0
            fi
            sleep 2
          done
          cat target/system-server.log
          exit 1

      - name: Execute real-browser system scenarios
        run: node scripts/system_browser_test.cjs

      - name: Upload browser evidence and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-system-evidence
          path: |
            system-test-evidence/**
            target/system-server.log
          if-no-files-found: warn
